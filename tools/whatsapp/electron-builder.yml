# WhatsApp Guajardo: WhatsApp Web en un programa aparte de la aplicación principal, de 32 bits, que no se instala.
# Dos formas: un .exe portátil (un solo archivo, pero se descomprime en cada apertura: lento) y un .zip con la carpeta
# (se descomprime una vez y abre al instante: es la que sirve para que la aplicación del negocio la abra con un número).
# Se arma desde la carpeta desktop (ya tiene electron-builder):  npm run whatsapp
appId: com.mercaderiaguajardo.whatsapp
productName: WhatsApp Guajardo
electronVersion: 22.3.27

directories:
  output: dist

files:
  - package.json
  - main.js
  - build/icon.ico
  - build/icon.png

asar: true
npmRebuild: false

win:
  icon: build/icon.ico
  executableName: WhatsAppGuajardo
  target:
    - target: portable
      arch:
        - ia32
    - target: zip
      arch:
        - ia32

portable:
  artifactName: WhatsAppGuajardo-${version}.exe

artifactName: WhatsAppGuajardo-${version}-carpeta.${ext}

publish: null
