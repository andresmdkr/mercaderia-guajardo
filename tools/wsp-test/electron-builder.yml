# Prueba aparte de la aplicación principal: WhatsApp Web en un programa de 32 bits que no se instala.
# Dos formas: un .exe portátil (un solo archivo, pero se descomprime en cada apertura: lento) y un .zip con la carpeta
# (se descomprime una vez y abre al instante: es la que sirve para que la aplicación del negocio la abra con un número).
# Se arma desde la carpeta desktop (ya tiene electron-builder):  npm run wsp-test
appId: com.mercaderiaguajardo.wsptest
productName: WhatsApp Prueba
electronVersion: 22.3.27

directories:
  output: dist

files:
  - package.json
  - main.js

asar: true
npmRebuild: false

win:
  executableName: WhatsAppPrueba
  target:
    - target: portable
      arch:
        - ia32
    - target: zip
      arch:
        - ia32

portable:
  artifactName: WhatsAppPrueba-${version}.exe

artifactName: WhatsAppPrueba-${version}-carpeta.${ext}

publish: null
