name: Aplicación de escritorio

# Compila el instalador de Windows (32 bits, sirve también en 64 bits) y lo publica en "Releases".
# - Al subir una etiqueta vX.Y.Z (que tiene que coincidir con la versión de desktop/package.json)
#   se publica la versión: las PC con la aplicación instalada la descargan solas.
# - También se puede correr a mano desde la pestaña Actions: compila y prueba, pero NO publica.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verificar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "La etiqueta $($env:GITHUB_REF_NAME) no coincide con la versión $version de desktop/package.json"
          }

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # SQLite es un módulo nativo: se baja ya compilado para 32 bits (no se compila nada).
      - name: SQLite precompilado para 32 bits
        run: |
          Push-Location node_modules/sqlite3
          node ../prebuild-install/bin.js -r napi --arch ia32 --platform win32
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo bajar el SQLite de 32 bits' }
          Pop-Location
          $file = Get-ChildItem node_modules/sqlite3 -Recurse -Filter node_sqlite3.node | Select-Object -First 1
          if (-not $file) { throw 'No se encontró node_sqlite3.node' }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("Módulo nativo: {0} · tipo de procesador 0x{1:X}" -f $file.FullName, $machine)
          if ($machine -ne 0x14C) { throw 'El módulo de SQLite NO es de 32 bits' }

      # Se construye UNA sola vez el instalador completo (esto también genera app-update.yml, que le
      # dice a la aplicación instalada de dónde bajar las actualizaciones). Lo que se prueba y lo que
      # se publica son exactamente los mismos archivos.
      - name: Construir el instalador
        run: npx electron-builder --win --ia32 --publish never

      # Se ejecuta la aplicación de 32 bits ya empaquetada y se le pide el informe de compatibilidad.
      - name: Prueba automática de la aplicación empaquetada
        run: |
          $exe = Get-ChildItem dist/win-ia32-unpacked -Filter MercaderiaGuajardo.exe | Select-Object -First 1
          if (-not $exe) { throw 'No se generó MercaderiaGuajardo.exe' }
          if (-not (Test-Path dist/win-ia32-unpacked/resources/app-update.yml)) {
            throw 'Falta resources/app-update.yml: la aplicación no podría actualizarse sola'
          }
          $env:SMOKE_OUT = Join-Path $PWD 'smoke.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'La prueba automática no terminó en 2 minutos' }
          if (Test-Path smoke.json) { Get-Content smoke.json }
          if ($process.ExitCode -ne 0) { throw "La prueba automática falló (código $($process.ExitCode))" }

      # La versión se crea primero y después se le suben los archivos ya construidos (sin usar el
      # publicador de electron-builder, que al crear la versión en paralelo la dejaba duplicada).
      - name: Crear la versión en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "Versión $($env:GITHUB_REF_NAME.TrimStart('v'))"
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la versión' }
          }

      - name: Subir el instalador a la versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object {
            $_.Name -like 'MercaderiaGuajardo-Setup-*.exe' -or $_.Name -like '*.exe.blockmap' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw "Se esperaban 3 archivos (instalador, blockmap y latest.yml) y hay $($files.Count)" }
          gh release upload $env:GITHUB_REF_NAME @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron subir los archivos' }

      # Comprobación final: la versión tiene que existir una sola vez y tener el instalador y el latest.yml.
      - name: Verificar los archivos de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          if (@($releases).Count -ne 1) { throw "Hay $(@($releases).Count) versiones con la etiqueta $($env:GITHUB_REF_NAME); tiene que haber una sola" }
          $names = @($releases[0].assets | ForEach-Object { $_.name })
          Write-Host ("Archivos de la versión: " + ($names -join ', '))
          foreach ($needed in @('latest.yml', "MercaderiaGuajardo-Setup-$($releases[0].tag_name.TrimStart('v')).exe")) {
            if ($names -notcontains $needed) { throw "Falta $needed en la versión publicada" }
          }
          if ($releases[0].draft) { throw 'La versión quedó como borrador' }

      - name: Guardar el instalador como archivo de la corrida
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: desktop/dist/*.exe
