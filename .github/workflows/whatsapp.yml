name: WhatsApp Guajardo (programa aparte)

# WhatsApp Guajardo es un programa aparte de la aplicación del negocio (carpeta tools/whatsapp). Este flujo lo compila y:
# - Al subir una etiqueta whatsapp-vX.Y.Z (que tiene que coincidir con la versión de tools/whatsapp/package.json) lo deja
#   para descargar en "Releases", SIEMPRE como pre-versión y sin ser la "última versión".
# - Desde la pestaña Actions se puede correr a mano: compila y revisa, pero NO publica (deja los archivos en la corrida).
#
# CUIDADO: la aplicación del negocio se actualiza sola leyendo la "última versión" de GitHub (releases/latest, que ignora las
# pre-versiones). Si esta versión llegara a ser la última, las PC dejarían de encontrar sus actualizaciones. Por eso nunca se
# publica sin --prerelease y, después de publicar, se comprueba que la última versión siga siendo la de la aplicación.
on:
  push:
    tags:
      - 'whatsapp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verificar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/whatsapp-v')
        run: |
          $version = (Get-Content ../tools/whatsapp/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "whatsapp-v$version") {
            throw "La etiqueta $($env:GITHUB_REF_NAME) no coincide con la versión $version de tools/whatsapp/package.json"
          }

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # Mismo comando que se usa en la PC de desarrollo: arma el .exe portátil y la carpeta en .zip (32 bits).
      - name: Construir WhatsApp Guajardo
        run: npm run whatsapp

      - name: Revisar los archivos
        run: |
          $dist = '../tools/whatsapp/dist'
          $version = (Get-Content ../tools/whatsapp/package.json | ConvertFrom-Json).version
          $portable = Get-Item "$dist/WhatsAppGuajardo-$version.exe" -ErrorAction SilentlyContinue
          $folder = Get-Item "$dist/WhatsAppGuajardo-$version-carpeta.zip" -ErrorAction SilentlyContinue
          if (-not $portable) { throw 'Falta el .exe portátil' }
          if (-not $folder) { throw 'Falta el .zip con la carpeta' }
          foreach ($file in @($portable, $folder)) {
            Write-Host ("{0}: {1:N1} MB" -f $file.Name, ($file.Length / 1MB))
            if ($file.Length -lt 20MB) { throw "$($file.Name) es demasiado chico: la construcción salió mal" }
          }
          # El .zip tiene que traer el programa para poder abrirlo desde la aplicación del negocio
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($folder.FullName)
          try {
            if (-not ($zip.Entries | Where-Object { $_.Name -eq 'WhatsAppGuajardo.exe' })) { throw 'El .zip no trae WhatsAppGuajardo.exe' }
          } finally { $zip.Dispose() }

      - name: Publicar como pre-versión
        if: startsWith(github.ref, 'refs/tags/whatsapp-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content ../tools/whatsapp/package.json | ConvertFrom-Json).version
          $notes = @"
          Programa aparte de la aplicación del negocio: WhatsApp Web en una ventana propia, liviana, de 32 bits. No se instala.

          - **WhatsAppGuajardo-$version-carpeta.zip** (recomendado): se descomprime una sola vez en una carpeta fija y abre al instante. Es el que sirve para elegirlo en la aplicación (Configuración, WhatsApp, "En otra aplicación").
          - **WhatsAppGuajardo-$version.exe**: portátil, un solo archivo; se descomprime en cada apertura, por eso tarda más.

          Esta pre-versión NO es una actualización de la aplicación del negocio: la aplicación se actualiza sola por su cuenta.
          "@
          gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease --latest=false --title "WhatsApp Guajardo $version" --notes $notes `
            "../tools/whatsapp/dist/WhatsAppGuajardo-$version.exe" "../tools/whatsapp/dist/WhatsAppGuajardo-$version-carpeta.zip"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la pre-versión' }

      # Comprobación final: esta publicación no puede haber tocado la actualización de la aplicación del negocio.
      - name: Verificar que la aplicación del negocio sigue actualizándose
        if: startsWith(github.ref, 'refs/tags/whatsapp-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mine = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          if (@($mine).Count -ne 1) { throw "Hay $(@($mine).Count) versiones con la etiqueta $($env:GITHUB_REF_NAME); tiene que haber una sola" }
          if (-not $mine[0].prerelease) { throw 'La versión de WhatsApp Guajardo NO quedó como pre-versión' }
          if ($mine[0].draft) { throw 'La versión quedó como borrador' }
          $latest = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest" | ConvertFrom-Json
          Write-Host "Última versión de GitHub: $($latest.tag_name)"
          if ($latest.tag_name -like 'whatsapp-*') { throw 'La última versión es la de WhatsApp Guajardo: la aplicación dejaría de actualizarse' }
          if (-not ($latest.assets | Where-Object { $_.name -eq 'latest.yml' })) { throw "La última versión ($($latest.tag_name)) no tiene latest.yml" }
          Write-Host 'Bien: la aplicación del negocio sigue encontrando su latest.yml'

      - name: Guardar los archivos como resultado de la corrida
        if: ${{ !startsWith(github.ref, 'refs/tags/whatsapp-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-guajardo
          path: |
            tools/whatsapp/dist/*.exe
            tools/whatsapp/dist/*.zip
